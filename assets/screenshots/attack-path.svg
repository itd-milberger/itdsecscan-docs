<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Mock-up of an attack path graph (illustrative data, not a real scan)</title>
  <rect width="860" height="320" rx="10" fill="#1d232a"/>

  <text x="24" y="34" fill="#e2e8f0" font-size="13" font-weight="700">Shortest paths to Tier 0</text>
  <rect x="24" y="46" width="230" height="24" rx="12" fill="#191e24" stroke="#2a323c"/>
  <text x="139" y="62" fill="#a6adbb" font-size="11.5" text-anchor="middle">alice.user &#8594; Domain Controllers</text>

  <!-- graph area -->
  <rect x="24" y="86" width="812" height="180" rx="8" fill="#15191e" stroke="#2a323c"/>

  <!-- node 1 -->
  <rect x="60" y="156" width="150" height="46" rx="8" fill="#191e24" stroke="#a6adbb"/>
  <text x="135" y="176" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="600">alice.user</text>
  <text x="135" y="192" fill="#a6adbb" font-size="10.5" text-anchor="middle">standard user</text>

  <!-- arrow 1 -->
  <line x1="210" y1="179" x2="320" y2="179" stroke="#fcb700" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="265" y="169" fill="#fcb700" font-size="11" text-anchor="middle">GenericAll</text>

  <!-- node 2 -->
  <rect x="330" y="156" width="150" height="46" rx="8" fill="#191e24" stroke="#fcb700"/>
  <text x="405" y="176" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="600">svc-app01</text>
  <text x="405" y="192" fill="#a6adbb" font-size="10.5" text-anchor="middle">service account</text>

  <!-- arrow 2 -->
  <line x1="480" y1="179" x2="590" y2="179" stroke="#ff637d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="535" y="169" fill="#ff637d" font-size="11" text-anchor="middle">DCSync rights</text>

  <!-- node 3 - tier 0 -->
  <rect x="600" y="150" width="180" height="58" rx="8" fill="#2a1820" stroke="#ff637d" stroke-width="2"/>
  <text x="690" y="174" fill="#ff637d" font-size="12.5" text-anchor="middle" font-weight="700">Domain Controllers</text>
  <text x="690" y="192" fill="#e2e8f0" font-size="10.5" text-anchor="middle">Tier 0</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a6adbb"/>
    </marker>
  </defs>

  <text x="24" y="290" fill="#a6adbb" font-size="11.5" font-style="italic">These paths show 2 of its 9 relationships. Selecting a node highlights its steps.</text>
</svg>
