<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="'Montserrat',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Mock-up of the accept-risk dialog and to-do states (illustrative data, not a real scan)</title>
  <rect width="860" height="320" rx="10" fill="#10223b"/>

  <!-- left: accept risk dialog -->
  <rect x="24" y="20" width="380" height="280" rx="10" fill="#0c1a2e" stroke="#213855"/>
  <text x="48" y="52" fill="#e2e8f0" font-size="13.5" font-weight="700">Accept risk</text>

  <text x="48" y="80" fill="#a6adbb" font-size="11">REASON</text>
  <rect x="48" y="88" width="332" height="56" rx="6" fill="#081322" stroke="#213855"/>
  <text x="58" y="108" fill="#e2e8f0" font-size="11.5">Legacy print server, decommission</text>
  <text x="58" y="124" fill="#e2e8f0" font-size="11.5">scheduled for Q1.</text>

  <text x="48" y="164" fill="#a6adbb" font-size="11">APPROVER</text>
  <rect x="48" y="172" width="332" height="30" rx="6" fill="#081322" stroke="#213855"/>
  <text x="58" y="192" fill="#e2e8f0" font-size="11.5">j.huber@contoso.com</text>

  <text x="48" y="222" fill="#a6adbb" font-size="11">REVIEW DATE</text>
  <rect x="48" y="230" width="332" height="30" rx="6" fill="#081322" stroke="#213855"/>
  <text x="58" y="250" fill="#e2e8f0" font-size="11.5">2026-12-01</text>

  <rect x="48" y="270" width="120" height="28" rx="6" fill="#2d80e7"/>
  <text x="108" y="289" fill="#ffffff" font-size="11.5" text-anchor="middle" font-weight="600">Confirm</text>

  <!-- right: to-do states -->
  <rect x="424" y="20" width="412" height="280" rx="10" fill="#0c1a2e" stroke="#213855"/>
  <text x="448" y="52" fill="#e2e8f0" font-size="13.5" font-weight="700">To Do — three states</text>

  <g>
    <circle cx="460" cy="92" r="6" fill="none" stroke="#a6adbb" stroke-width="1.5"/>
    <text x="480" y="97" fill="#e2e8f0" font-size="12">unmarked</text>
    <text x="480" y="113" fill="#a6adbb" font-size="10.5">GPO disables SMB signing on file servers</text>
  </g>

  <g>
    <circle cx="460" cy="152" r="6" fill="#fcb700"/>
    <text x="480" y="157" fill="#e2e8f0" font-size="12">marked — intend to fix</text>
    <text x="480" y="173" fill="#a6adbb" font-size="10.5">3 stale computer accounts, inactive 180+ days</text>
  </g>

  <g>
    <circle cx="460" cy="212" r="6" fill="#00d390"/>
    <path d="M457,212 l2,3 l5,-6" stroke="#0c1a2e" stroke-width="1.6" fill="none"/>
    <text x="480" y="217" fill="#a6adbb" font-size="12" text-decoration="line-through">done — gone from this scan</text>
    <text x="480" y="233" fill="#a6adbb" font-size="10.5">Anonymous LDAP bind disabled on all DCs</text>
  </g>

  <rect x="448" y="252" width="364" height="1" fill="#213855"/>
  <text x="448" y="276" fill="#a6adbb" font-size="11" font-style="italic">Of the fourteen you took on, six are gone from this scan.</text>
</svg>
