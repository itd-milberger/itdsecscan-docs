<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Mock-up of a finding row, expanded (illustrative data, not a real scan)</title>
  <rect width="860" height="300" rx="10" fill="#1d232a"/>

  <rect x="16" y="16" width="828" height="268" rx="10" fill="#191e24" stroke="#2a323c"/>
  <rect x="16" y="16" width="4" height="268" rx="2" fill="#fcb700"/>

  <rect x="40" y="36" width="46" height="20" rx="10" fill="#fcb700"/>
  <text x="63" y="50" fill="#1d232a" font-size="11" font-weight="700" text-anchor="middle">HIGH</text>

  <text x="98" y="51" fill="#e2e8f0" font-size="14.5" font-weight="600">jsvc-backup is Kerberoastable and its password has not changed in 940 days</text>

  <text x="40" y="80" fill="#a6adbb" font-size="12" font-family="'IBM Plex Mono','Consolas','SFMono-Regular',Menlo,Monaco,monospace">CN=jsvc-backup,OU=Service Accounts,DC=contoso,DC=com</text>

  <rect x="40" y="98" width="788" height="1" fill="#2a323c"/>

  <text x="40" y="122" fill="#e2e8f0" font-size="12.5" font-weight="700">How to fix</text>
  <text x="40" y="144" fill="#a6adbb" font-size="12">Set a long, randomly generated password on the account, or move the workload to a</text>
  <text x="40" y="162" fill="#a6adbb" font-size="12">group-managed service account (gMSA), which rotates its own password.</text>

  <rect x="40" y="180" width="788" height="40" rx="6" fill="#15191e" stroke="#2a323c"/>
  <text x="52" y="205" fill="#00d390" font-size="12" font-family="'IBM Plex Mono','Consolas','SFMono-Regular',Menlo,Monaco,monospace">Set-ADAccountPassword -Identity 'jsvc-backup' -Reset -NewPassword (Read-Host -AsSecureString)</text>

  <rect x="40" y="238" width="112" height="30" rx="6" fill="#15191e" stroke="#2a323c"/>
  <text x="96" y="257" fill="#e2e8f0" font-size="12" text-anchor="middle">Accept risk</text>

  <rect x="162" y="238" width="80" height="30" rx="6" fill="#15191e" stroke="#2a323c"/>
  <text x="202" y="257" fill="#e2e8f0" font-size="12" text-anchor="middle">Mark</text>
</svg>
